[package]
name = "primersearch"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rayon = "1.10"
indicatif = "0.17"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
